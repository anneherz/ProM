}).addTo(map);

function getRadius(n){
  if(n<=1)return 6;if(n<=3)return 8;if(n<=6)return 11;
  if(n<=10)return 14;if(n<=15)return 17;return 21;
}

// Landmark markers (pyramids)
landmarks.forEach(function(lm){
  var icon=L.divIcon({className:'',
    html:'<div style="text-align:center;line-height:1;">'
        +'<div style="font-size:11px;color:#bbb;">▲</div>'
        +'<div style="font-size:7.5px;color:#aaa;white-space:nowrap;margin-top:1px;font-family:Georgia,serif;letter-spacing:.03em;">'+lm.name+'</div>'
        +'</div>',
    iconSize:[90,28],iconAnchor:[45,8],popupAnchor:[0,-14]});
  L.marker([lm.lat,lm.lon],{icon:icon,interactive:false,zIndexOffset:-300}).addTo(map);
});

mapPoints.forEach(function(pt){
  var col=ZONE_COLORS[pt.zone]||'#666';
  var r=getRadius(pt.count);
  var isNonTomb=NON_TOMBS.indexOf(pt.zone)>=0;
  var marker;

  if(pt.uncertain){
    var sz=r*2;
    var icon=L.divIcon({className:'',
      html:'<div style="width:'+sz+'px;height:'+sz+'px;background:rgba(150,150,150,0.18);border:2px dashed #999;border-radius:50%;box-sizing:border-box;"></div>',
      iconSize:[sz,sz],iconAnchor:[r,r],popupAnchor:[0,-r]});
    marker=L.marker([pt.lat,pt.lon],{icon:icon}).addTo(map);
  }else if(isNonTomb){
    var sz=r*2;
    var icon=L.divIcon({className:'',
      html:'<div style="width:'+sz+'px;height:'+sz+'px;background:'+col+
           ';border:1px solid rgba(0,0,0,.25);border-radius:2px;opacity:.88;"></div>',
      iconSize:[sz,sz],iconAnchor:[r,r],popupAnchor:[0,-r]});
    marker=L.marker([pt.lat,pt.lon],{icon:icon}).addTo(map);
  }else{
    marker=L.circleMarker([pt.lat,pt.lon],{
      radius:r,fillColor:col,color:'rgba(0,0,0,.25)',weight:1,fillOpacity:.88
    }).addTo(map);
  }

  // Build object rows with inv + museum
  var objRows='';
  pt.objects.slice(0,25).forEach(function(o){
    var subtype=o.subtype||o.type||'';
    var invHtml='';
    if(o.inv){
      invHtml='<span class="obj-inv">'+o.inv+'</span>';
    }
    var placeHtml='';
    if(o.museum){
      placeHtml='<span class="obj-museum">'+o.museum+'</span>';
    }else{
      placeHtml='<span class="obj-insitu">in situ / Main Magazine</span>';
    }
    objRows+='<li class="obj-item">'
      +'<div class="obj-subtype">'+subtype+'</div>'
      +'<div class="obj-inv-row">'+invHtml+placeHtml+'</div>'
      +'</li>';
  });
  if(pt.objects.length>25)objRows+='<li class="more">… and '+(pt.objects.length-25)+' more</li>';

  var uncertainNote=pt.uncertain?'<div style="font-size:10px;color:#888;font-style:italic;margin-bottom:4px;">⚠ Exact location unknown</div>':'';
  var titleKey=pt.name+'|'+pt.id_location;
  var titles=tombTitles[titleKey]||[];
  var titlesHtml='';
  if(titles.length>0){
    titlesHtml='<div class="popup-titles"><span class="popup-titles-label">Titles</span>'
      +titles.join('<br>')+'</div>';
  }
  var profKey=pt.name+'|'+pt.id_location;
  var profData=tombProfessions[profKey]||null;
  var profHtml='';
  if(profData){
    var profGroups='';
    Object.keys(profData).forEach(function(main){
      var subs=profData[main];
      profGroups+='<div class="popup-prof-group">'
        +'<span class="popup-prof-main">'+main+'</span>'
        +'<span class="popup-prof-sub">'+subs.join(' · ')+'</span>'
        +'</div>';
    });
    profHtml='<div class="popup-prof"><span class="popup-prof-label">Profession groups</span>'+profGroups+'</div>';
  }
  var tombNum=tombNumbers[pt.id_location]||'';
  var nameDisplay=tombNum?'<span style="font-size:11px;color:#888;font-weight:normal;font-family:monospace;">'+tombNum+'</span>: '+pt.name:pt.name;
  var popup='<div class="popup-inner">'
    +'<span class="popup-zone-tag" style="background:'+col+';">'+pt.zone+'</span>'
    +'<h3>'+nameDisplay+'</h3>'
    +uncertainNote
    +titlesHtml
    +profHtml
    +'<div class="popup-count">'+pt.count+' object'+(pt.count>1?'s':'')+'</div>'
    +'<ul class="obj-list">'+objRows+'</ul></div>';
  marker.bindPopup(popup,{maxWidth:320});

  if(pt.count>=4&&!isNonTomb&&!pt.uncertain){
    var lbl=L.divIcon({className:'',
      html:'<span style="font-family:Georgia,serif;font-size:9px;color:#fff;font-weight:bold;text-shadow:0 0 2px rgba(0,0,0,.8);">'+pt.count+'</span>',
      iconSize:[r*2,r*2],iconAnchor:[r,r]});
    L.marker([pt.lat,pt.lon],{icon:lbl,interactive:false}).addTo(map);
  }

  marker.bindTooltip(pt.name,{permanent:false,direction:'top',offset:[0,-r-2]});
});

// Legend
var legend=L.control({position:'bottomright'});
legend.onAdd=function(){
  var div=L.DomUtil.create('div','legend');
  var html='<div class="legend-title">Cemetery area</div>';
  var hasSep=false;
  legendZones.forEach(function(z){
    if(z.is_non_tomb&&!hasSep){html+='<div class="legend-sep"></div>';hasSep=true;}
    var shape=z.is_non_tomb
      ?'<span class="leg-swatch square" style="background:'+z.col+';"></span>'
      :'<span class="leg-swatch" style="background:'+z.col+';"></span>';
    var counts=z.is_non_tomb
      ?z.n_obj+' obj.'
      :z.n_tombs+' tomb'+(z.n_tombs>1?'s':'')+' · '+z.n_obj+' obj.';
    html+='<div class="legend-row">'+shape
      +'<span class="leg-text">'+z.zone+'</span>'
      +'<span class="leg-nums">'+counts+'</span></div>';
  });
  html+='<div class="legend-sep"></div>'
    +'<div class="legend-row"><span class="leg-swatch" style="background:#888;"></span><span class="leg-text">tomb context</span></div>'
    +'<div class="legend-row"><span class="leg-swatch square" style="background:#888;"></span><span class="leg-text">findspot (no tomb)</span></div>'
    +'<div class="legend-row"><div style="width:13px;height:13px;border-radius:50%;border:2px dashed #999;background:rgba(150,150,150,0.18);box-sizing:border-box;flex-shrink:0;"></div><span class="leg-text" style="color:#888;font-style:italic;margin-left:8px;">exact location unknown</span></div>';
  div.innerHTML=html;
  return div;
};
