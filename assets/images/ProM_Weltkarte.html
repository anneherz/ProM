* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; font-family: 'Georgia', serif; }
#map { width: 100%; height: 100vh; }

#titlebar {

}

}

#titlebar .stats {

  gap: 12px;
}
#titlebar .stats span {

}
#titlebar .stats span b {

}

#legend {

  bottom: 28px;
  left: 14px;

  font-family: Arial, sans-serif;

  color: #444;
  line-height: 1.6;

}

  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #999;
  margin-bottom: 7px;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 5px;
}
.legend-dot {
  border-radius: 50%;
  background: #e66a1a;
  opacity: 0.85;
  border: 1.5px solid white;
  box-shadow: 0 0 0 1px #ccc;

  font-size: 9px;
  font-weight: bold;

  font-family: Arial, sans-serif;
}
#legend .note {

  padding-top: 7px;

  font-size: 10px;
  color: #bbb;
}

.leaflet-popup-content-wrapper {

  font-size: 13px;

.popup-meta { font-size: 12px; color: #666; margin-bottom: 7px; }

.popup-institutions {
  font-size: 12px; color: #555; line-height: 1.7;

}
.popup-institutions div::before { content: "• "; color: #e66a1a; }

    fillColor: '#e66a1a',
    color: '#ffffff',
    weight: 1.5,
    opacity: 1,
    fillOpacity: 0.85

  const objLabel  = loc.obj  === 1 ? '1 object'    : loc.obj  + ' objects';
  const provLabel = loc.prov === 1 ? '1 provenance' : loc.prov + ' provenances';

  const popup =

  marker.bindPopup(popup, {maxWidth: 320, offset: [0, -4]});

      html: '<div style="width:' + (r*2) + 'px;height:' + (r*2) + 'px;line-height:' + (r*2) + 'px;text-align:center;font-size:9px;font-weight:bold;color:white;font-family:Arial,sans-serif;">' + loc.obj + '</div>',

});
