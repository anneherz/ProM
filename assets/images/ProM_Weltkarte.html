locations.forEach(loc => {
  const r = getRadius(loc.object_count);

  const marker = L.circleMarker([loc.lat_decimal, loc.lon_decimal], {
    radius: r,
    fillColor: '#e66a1a',
    color: '#ffffff',
    weight: 1.5,
    opacity: 1,
    fillOpacity: 0.85
  }).addTo(map);

  // Build popup with per-provenance rows
  const rows = loc.provenance_details.map(p => {
    const n = p.object_count === 1 ? '1 object' : p.object_count + ' objects';
    return '<tr><td class="pname">' + p.provenance_name + '</td><td class="pcount">' + n + '</td></tr>';
  }).join('');

  const totObj  = loc.object_count === 1 ? '1 object' : loc.object_count + ' objects';
  const totProv = loc.provenance_count === 1 ? '1 provenance' : loc.provenance_count + ' provenances';

  const popup =
    '<div class="popup-location">' + loc.town + ', ' + loc.country + '</div>' +
    '<div class="popup-total">' + totObj + ' &nbsp;·&nbsp; ' + totProv + '</div>' +
    '<table class="popup-table">' + rows + '</table>';

  marker.bindPopup(popup, {maxWidth: 360, offset: [0, -4]});

  // Number label on larger dots
  if (loc.object_count >= 21) {
    const icon = L.divIcon({
      html: '<div style="width:' + (r*2) + 'px;height:' + (r*2) + 'px;line-height:' + (r*2) + 'px;text-align:center;font-size:9px;font-weight:bold;color:white;font-family:Arial,sans-serif;">' + loc.object_count + '</div>',
      className: '', iconSize: [r*2, r*2], iconAnchor: [r, r]
    });
    L.marker([loc.lat_decimal, loc.lon_decimal], {icon, interactive: false}).addTo(map);
  }
});

setTimeout(() => { map.panBy([0, -25], {animate: false}); }, 100);

</script>
